<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0"/>
<meta name="theme-color" content="#0f3d2e"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="mobile-web-app-capable" content="yes"/>
<title>My Tasks</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet"/>
<style>
:root{
  --green-deep:#0f3d2e;--green-mid:#1a5c43;--green-bright:#2d8a5e;
  --green-light:#e8f5ef;--green-pale:#f2faf6;
  --gold:#c8993a;--red:#b33a3a;--red-light:#fdeaea;
  --amber:#b87e1a;--amber-light:#fdf0d5;
  --text-primary:#0f1f18;--text-secondary:#4a6358;--text-muted:#8aa89c;
  --border:#d4e8de;--white:#ffffff;--surface:#f7fcf9;
  --radius:14px;--radius-sm:8px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;font-family:'DM Sans',sans-serif;background:var(--surface);color:var(--text-primary);overflow-x:hidden}
body{display:flex;flex-direction:column;max-width:480px;margin:0 auto;min-height:100vh;background:var(--white)}
.topbar{background:var(--green-deep);position:sticky;top:0;z-index:100;padding:env(safe-area-inset-top,0) 0 0}
.topbar-inner{padding:16px 20px 14px;display:flex;align-items:center;justify-content:space-between}
.app-name{font-family:'DM Serif Display',serif;font-size:22px;color:#fff;line-height:1;display:flex;align-items:center;gap:8px}
.sync-dot{width:9px;height:9px;border-radius:50%;background:#4caf50;flex-shrink:0}
.sync-dot.syncing{background:var(--gold);animation:pulse 1s infinite}
.sync-dot.offline{background:var(--red)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.3}}
.app-date{font-size:12px;color:rgba(255,255,255,0.6);margin-top:3px;font-weight:300}

.app-brand{display:flex;align-items:center;gap:12px}
.profile-pic{width:42px;height:42px;border-radius:50%;object-fit:cover;border:2px solid var(--gold);flex-shrink:0}

.add-fab{width:44px;height:44px;border-radius:50%;background:var(--gold);border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:26px;color:#fff;line-height:1}
.add-fab:active{transform:scale(0.93)}
.alert-bar{background:var(--red);color:#fff;padding:10px 20px;font-size:13px;font-weight:500;display:none;align-items:center;gap:8px}
.alert-bar.show{display:flex}
.info-bar{background:var(--green-mid);color:rgba(255,255,255,0.85);padding:7px 20px;font-size:12px;display:none;align-items:center;gap:6px}
.info-bar.show{display:flex}
.filter-tabs{display:flex;padding:0 16px;background:var(--green-deep);overflow-x:auto;scrollbar-width:none}
.filter-tabs::-webkit-scrollbar{display:none}
.ftab{flex-shrink:0;padding:10px 16px;font-size:13px;font-weight:500;color:rgba(255,255,255,0.55);border:none;background:transparent;cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap}
.ftab.active{color:#fff;border-bottom-color:var(--gold)}
.stats-row{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:16px 16px 8px}
.stat{background:var(--green-pale);border-radius:var(--radius-sm);padding:12px;text-align:center}
.stat-n{font-size:26px;font-weight:600;color:var(--green-deep);line-height:1}
.stat-l{font-size:11px;color:var(--text-secondary);margin-top:3px}
.sort-label{font-size:11px;color:var(--text-muted);padding:4px 16px 8px;font-style:italic}
.task-list{padding:0 12px 100px;display:flex;flex-direction:column;gap:8px}
.task-card{background:var(--white);border:1px solid var(--border);border-radius:var(--radius);padding:14px 14px 12px;display:flex;gap:12px;align-items:flex-start;position:relative;overflow:hidden}
.task-card::before{content:'';position:absolute;left:0;top:0;bottom:0;width:4px}
.task-card.pri-High::before{background:var(--red)}
.task-card.pri-Medium::before{background:var(--gold)}
.task-card.pri-Low::before{background:var(--green-bright)}
.task-card.done{opacity:0.45}
.task-card.done .task-title{text-decoration:line-through}
.task-card.ringing{animation:ring-pulse 0.5s infinite alternate}
@keyframes ring-pulse{from{box-shadow:0 0 0 0 rgba(179,58,58,0.4)}to{box-shadow:0 0 0 8px rgba(179,58,58,0)}}
.check-btn{width:22px;height:22px;border-radius:50%;border:1.5px solid var(--border);background:transparent;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:2px;font-size:12px;font-weight:700;color:transparent}
.task-card.done .check-btn{background:var(--green-bright);border-color:var(--green-bright);color:#fff}
.task-body{flex:1;min-width:0}
.task-title{font-size:15px;font-weight:500;color:var(--text-primary);line-height:1.4}
.task-meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:7px;align-items:center}
.badge{font-size:11px;padding:3px 9px;border-radius:20px;font-weight:500}
.badge-High{background:var(--red-light);color:var(--red)}
.badge-Medium{background:var(--amber-light);color:var(--amber)}
.badge-Low{background:var(--green-light);color:var(--green-mid)}
.badge-cat{background:var(--green-pale);color:var(--text-secondary)}
.due-chip{font-size:11px;color:var(--text-muted)}
.due-chip.alert{color:var(--red);font-weight:500}
.card-actions{display:flex;flex-direction:column;gap:4px;flex-shrink:0}
.edit-btn,.del-btn{background:transparent;border:none;cursor:pointer;color:var(--text-muted);font-size:14px;padding:2px 4px;border-radius:6px;line-height:1}
.edit-btn:active{background:var(--green-light);color:var(--green-mid)}
.del-btn:active{background:var(--red-light);color:var(--red)}
.empty{text-align:center;padding:3rem 2rem;color:var(--text-muted);font-size:14px}
.loading{text-align:center;padding:2.5rem;color:var(--text-muted);font-size:13px}

/* SHEET */
.sheet-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.45);z-index:200;display:none;align-items:flex-end}
.sheet-overlay.open{display:flex}
.sheet{background:var(--white);border-radius:20px 20px 0 0;padding:0 0 env(safe-area-inset-bottom,16px);width:100%;max-height:92vh;overflow-y:auto}
.sheet-handle{width:40px;height:4px;background:var(--border);border-radius:2px;margin:12px auto 4px}
.sheet-title{font-family:'DM Serif Display',serif;font-size:20px;padding:8px 20px 16px;color:var(--green-deep)}
.field{padding:0 20px 14px}
.field label{display:block;font-size:12px;font-weight:600;color:var(--text-secondary);margin-bottom:6px;letter-spacing:0.3px}
.field input,.field select,.field textarea{width:100%;font-size:15px;padding:12px 14px;border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--surface);color:var(--text-primary);font-family:'DM Sans',sans-serif;-webkit-appearance:none}
.field textarea{resize:vertical;min-height:70px}
.field input:focus,.field select:focus,.field textarea:focus{outline:2px solid var(--green-bright);border-color:transparent}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:0 20px 14px}
.field-row .field{padding:0}
.save-btn{display:block;width:calc(100% - 40px);margin:4px 20px 16px;padding:15px;background:var(--green-deep);color:#fff;border:none;border-radius:var(--radius);font-size:16px;font-weight:600;font-family:'DM Sans',sans-serif;cursor:pointer}
.save-btn:active{background:var(--green-mid)}
.other-input{display:none;margin-top:8px}
.other-input.show{display:block}

/* ALARM MODAL */
.alarm-modal{position:fixed;inset:0;background:rgba(0,0,0,0.7);z-index:300;display:none;align-items:center;justify-content:center;padding:20px}
.alarm-modal.open{display:flex}
.alarm-box{background:var(--white);border-radius:20px;padding:28px 24px;width:100%;max-width:340px;text-align:center;animation:pop-in 0.3s ease}
@keyframes pop-in{from{transform:scale(0.85);opacity:0}to{transform:scale(1);opacity:1}}
.alarm-icon{font-size:52px;margin-bottom:10px;animation:shake 0.5s infinite}
@keyframes shake{0%,100%{transform:rotate(-8deg)}50%{transform:rotate(8deg)}}
.alarm-title{font-family:'DM Serif Display',serif;font-size:22px;color:var(--red);margin-bottom:8px}
.alarm-task{font-size:14px;color:var(--text-secondary);margin-bottom:8px;line-height:1.5;font-weight:500}
.alarm-time{font-size:12px;color:var(--text-muted);margin-bottom:22px}
.alarm-dismiss{background:var(--green-deep);color:#fff;border:none;padding:13px 32px;border-radius:var(--radius);font-size:15px;font-weight:600;cursor:pointer;width:100%}
</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-inner">
    <div class="app-brand">
      <img src="https://youthpower202-sudo.github.io/My-tasks/606A3204.JPG" class="profile-pic" alt="Charles Makongo" onerror="this.style.display='none'"/>
      <div>
        <div class="app-name">My Tasks <span class="sync-dot syncing" id="sync-dot"></span></div>
        <div class="app-date" id="today-label"></div>
      </div>
    </div>
    <button class="add-fab" onclick="openSheet()" aria-label="Add task">+</button>
  </div>
  <div class="alert-bar" id="alert-bar">⚠ <span id="alert-text"></span></div>
  <div class="info-bar" id="info-bar">↻ <span id="info-text">Connecting...</span></div>
  <div class="filter-tabs">
    <button class="ftab active" onclick="setFilter('all',this)">All</button>
    <button class="ftab" onclick="setFilter('High',this)">High</button>
    <button class="ftab" onclick="setFilter('Medium',this)">Medium</button>
    <button class="ftab" onclick="setFilter('Low',this)">Low</button>
    <button class="ftab" onclick="setFilter('done',this)">Done</button>
  </div>
</div>

<div class="stats-row" style="grid-template-columns:repeat(4,1fr)">
  <div class="stat"><div class="stat-n" id="s-total">—</div><div class="stat-l">Total</div></div>
  <div class="stat"><div class="stat-n" id="s-pending">—</div><div class="stat-l">Pending</div></div>
  <div class="stat" style="background:#fdeaea"><div class="stat-n" style="color:#b33a3a" id="s-delayed">—</div><div class="stat-l" style="color:#b33a3a">Delayed</div></div>
  <div class="stat"><div class="stat-n" id="s-done">—</div><div class="stat-l">Done</div></div>
</div>
<div class="sort-label">↑ Sorted by nearest deadline first</div>

<div class="task-list" id="task-list"><div class="loading">☁ Connecting to cloud sync...</div></div>

<!-- ADD / EDIT SHEET -->
<div class="sheet-overlay" id="sheet-overlay" onclick="closeSheet(event)">
  <div class="sheet">
    <div class="sheet-handle"></div>
    <div class="sheet-title" id="sheet-title">New Task</div>
    <div class="field">
      <label>Task description</label>
      <textarea id="f-title" placeholder="What needs to be done?"></textarea>
    </div>
    <div class="field">
      <label>Category</label>
      <select id="f-cat" onchange="handleCatChange()">
        <option value="YPO Operations">YPO Operations</option>
        <option value="SUA">SUA</option>
        <option value="Consulting">Consulting</option>
        <option value="Meetings">Meetings</option>
        <option value="Family">Family</option>
        <option value="Other">Other (specify below)</option>
      </select>
      <div class="other-input" id="other-input">
        <input id="f-other-cat" type="text" placeholder="Type your category..."/>
      </div>
    </div>
    <div class="field">
      <label>Priority</label>
      <select id="f-pri">
        <option value="High">High</option>
        <option value="Medium" selected>Medium</option>
        <option value="Low">Low</option>
      </select>
    </div>
    <div class="field-row">
      <div class="field">
        <label>Due date</label>
        <input id="f-due" type="date"/>
      </div>
      <div class="field">
        <label>Due time</label>
        <input id="f-time" type="time"/>
      </div>
    </div>
    <div class="field">
      <label>Remind me (before due time)</label>
      <select id="f-alarm">
        <option value="0">At exact due time</option>
        <option value="15">15 minutes before</option>
        <option value="30">30 minutes before</option>
        <option value="60" selected>1 hour before</option>
        <option value="120">2 hours before</option>
        <option value="1440">1 day before</option>
      </select>
    </div>
    <input type="hidden" id="f-edit-id"/>
    <button class="save-btn" id="save-btn" onclick="saveTask()">Save Task</button>
  </div>
</div>

<!-- ALARM POPUP -->
<div class="alarm-modal" id="alarm-modal">
  <div class="alarm-box">
    <div class="alarm-icon">⏰</div>
    <div class="alarm-title">Task Due!</div>
    <div class="alarm-task" id="alarm-task-text"></div>
    <div class="alarm-time" id="alarm-time-text"></div>
    <button class="alarm-dismiss" onclick="dismissAlarm()">Got it — Dismiss</button>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import {
  getFirestore, collection, addDoc, onSnapshot,
  updateDoc, deleteDoc, doc, serverTimestamp, query, orderBy
} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyCbPOfGejAGw9F_x0UglcOOiNV_dpY2-0c",
  authDomain: "my-tasks-c929c.firebaseapp.com",
  projectId: "my-tasks-c929c",
  storageBucket: "my-tasks-c929c.firebasestorage.app",
  messagingSenderId: "94161075172",
  appId: "1:94161075172:web:92f562bedb45d6a2b4a5f1"
};

const fbApp = initializeApp(firebaseConfig);
const db = getFirestore(fbApp);
const tasksCol = collection(db, "tasks");

let tasks = [];
let currentFilter = 'all';
let seeded = false;
let alarmTimers = [];
let audioCtx = null;
let ringingInterval = null;

// ── SYNC STATUS ──────────────────────────────────────────────────
function setSyncStatus(s) {
  const dot = document.getElementById('sync-dot');
  const bar = document.getElementById('info-bar');
  dot.className = 'sync-dot';
  if (s === 'live') bar.classList.remove('show');
  else if (s === 'syncing') { dot.classList.add('syncing'); bar.classList.add('show'); document.getElementById('info-text').textContent='↻ Syncing...'; }
  else if (s === 'offline') { dot.classList.add('offline'); bar.classList.add('show'); document.getElementById('info-text').textContent='Offline — will sync when connected'; }
}

// ── FIRESTORE LISTENER ───────────────────────────────────────────
const q = query(tasksCol, orderBy("createdAt", "asc"));
onSnapshot(q, async (snapshot) => {
  tasks = snapshot.docs.map(d => ({ id: d.id, ...d.data() }));
  setSyncStatus('live');
  if (!seeded && tasks.length === 0) {
    seeded = true;
    const today = new Date();
    const fd = d => { const x = new Date(today); x.setDate(x.getDate()+d); return x.toISOString().split('T')[0]; };
    const samples = [
      {title:'Submit Vijana Plus monthly report to Save the Children',cat:'YPO Operations',pri:'High',due:fd(1),time:'09:00',alarm:60,done:false},
      {title:'Follow up on EU funding disbursement with TBI',cat:'YPO Operations',pri:'High',due:fd(2),time:'10:00',alarm:60,done:false},
      {title:'Review and sign staff ID system memo',cat:'YPO Operations',pri:'Medium',due:fd(3),time:'14:00',alarm:30,done:false},
      {title:'Update Zoho Books — April 2026 petty cash entries',cat:'YPO Operations',pri:'Medium',due:fd(1),time:'11:00',alarm:60,done:false},
      {title:'Prepare VIDEE pitch deck final version',cat:'Consulting',pri:'High',due:fd(5),time:'08:00',alarm:1440,done:false},
    ];
    for (const t of samples) await addDoc(tasksCol, {...t, createdAt: serverTimestamp()});
    return;
  }
  seeded = true;
  scheduleAlarms();
  render();
}, err => { setSyncStatus('offline'); console.error(err); });

// ── RINGTONE (Web Audio) ─────────────────────────────────────────
function playRingtone() {
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();

    const notes = [880, 988, 1047, 988, 880, 0, 880, 988, 1047, 1175, 1047, 880];
    const dur = 0.18;
    let t = audioCtx.currentTime;

    notes.forEach(freq => {
      if (freq > 0) {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain); gain.connect(audioCtx.destination);
        osc.type = 'sine';
        osc.frequency.value = freq;
        gain.gain.setValueAtTime(0.35, t);
        gain.gain.exponentialRampToValueAtTime(0.001, t + dur * 0.9);
        osc.start(t); osc.stop(t + dur);
      }
      t += dur;
    });

    // Loop ringtone every 3 seconds
    return setInterval(() => {
      if (!audioCtx) return;
      const n2 = [880, 988, 1047, 988, 880, 0, 880, 988, 1047, 1175, 1047, 880];
      let t2 = audioCtx.currentTime;
      n2.forEach(freq => {
        if (freq > 0) {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.connect(gain); gain.connect(audioCtx.destination);
          osc.type = 'sine';
          osc.frequency.value = freq;
          gain.gain.setValueAtTime(0.35, t2);
          gain.gain.exponentialRampToValueAtTime(0.001, t2 + dur * 0.9);
          osc.start(t2); osc.stop(t2 + dur);
        }
        t2 += dur;
      });
    }, 3000);
  } catch(e) { return null; }
}

function stopRingtone() {
  if (ringingInterval) { clearInterval(ringingInterval); ringingInterval = null; }
}

// ── ALARMS ───────────────────────────────────────────────────────
function scheduleAlarms() {
  alarmTimers.forEach(t => clearTimeout(t));
  alarmTimers = [];
  const now = new Date();
  tasks.filter(t => !t.done && t.due && t.time).forEach(t => {
    const dueDate = new Date(`${t.due}T${t.time}`);
    const alarmTime = new Date(dueDate.getTime() - (t.alarm || 0) * 60000);
    const diff = alarmTime - now;
    if (diff > 0 && diff < 86400000 * 2) {
      const timer = setTimeout(() => triggerAlarm(t), diff);
      alarmTimers.push(timer);
    }
    // Also trigger at exact due time if alarm is before
    if (t.alarm > 0) {
      const exactDiff = dueDate - now;
      if (exactDiff > 0 && exactDiff < 86400000 * 2) {
        const exactTimer = setTimeout(() => triggerAlarm(t, true), exactDiff);
        alarmTimers.push(exactTimer);
      }
    }
  });
}

function triggerAlarm(task, isDue = false) {
  document.getElementById('alarm-task-text').textContent = task.title;
  document.getElementById('alarm-time-text').textContent = isDue
    ? '🔴 This task is due RIGHT NOW!'
    : `⏳ Due at ${fmt12(task.time)} — ${task.alarm} min reminder`;
  document.getElementById('alarm-modal').classList.add('open');

  // Pulse the matching card
  document.querySelectorAll('.task-card').forEach(c => c.classList.remove('ringing'));
  const card = document.querySelector(`[data-id="${task.id}"]`);
  if (card) card.classList.add('ringing');

  // Play ringtone
  ringingInterval = playRingtone();

  // Browser notification
  if (Notification.permission === 'granted') {
    new Notification(isDue ? '🔴 Task Due Now!' : '⏰ Task Reminder', {
      body: task.title,
      requireInteraction: true
    });
  }
}

window.dismissAlarm = () => {
  document.getElementById('alarm-modal').classList.remove('open');
  stopRingtone();
  document.querySelectorAll('.task-card').forEach(c => c.classList.remove('ringing'));
};

// ── DUE STATUS ───────────────────────────────────────────────────
function dueStatus(due, time, done) {
  if (!due || done) return null;
  const now = new Date();
  const dueDate = time ? new Date(`${due}T${time}`) : (() => { const d = new Date(due); d.setHours(23,59,0,0); return d; })();
  const diff = dueDate - now;
  const diffMins = Math.round(diff / 60000);
  const diffDays = Math.round(diff / 86400000);
  if (diff < 0) {
    const a = Math.abs(diffMins);
    if (a < 60) return {label:`Overdue ${a}m`, alert:true};
    if (a < 1440) return {label:`Overdue ${Math.round(a/60)}h`, alert:true};
    return {label:`Overdue ${Math.abs(diffDays)}d`, alert:true};
  }
  if (diffMins < 60) return {label:`Due in ${diffMins}m`, alert:true};
  if (diffMins < 1440) return {label:`Due in ${Math.round(diffMins/60)}h`, alert:true};
  if (diffDays === 0) return {label:'Due today'+(time?' at '+fmt12(time):''), alert:true};
  if (diffDays <= 2) return {label:`Due in ${diffDays}d`+(time?' at '+fmt12(time):''), alert:true};
  return {label: new Date(due).toLocaleDateString('en-GB',{day:'numeric',month:'short'})+(time?' '+fmt12(time):''), alert:false};
}

function fmt12(t) {
  if (!t) return '';
  const [h,m] = t.split(':').map(Number);
  return `${h%12||12}:${String(m).padStart(2,'0')} ${h>=12?'PM':'AM'}`;
}

function getDeadlineMs(t) {
  if (!t.due) return Infinity;
  const d = t.time ? new Date(`${t.due}T${t.time}`) : (() => { const x = new Date(t.due); x.setHours(23,59,0,0); return x; })();
  return d.getTime();
}

// ── FILTER ───────────────────────────────────────────────────────
window.setFilter = (f, btn) => {
  currentFilter = f;
  document.querySelectorAll('.ftab').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  render();
};

// ── TOGGLE DONE ──────────────────────────────────────────────────
window.toggleDone = async (id) => {
  setSyncStatus('syncing');
  const t = tasks.find(x => x.id === id);
  if (t) await updateDoc(doc(db,'tasks',id), {done: !t.done});
};

// ── DELETE ───────────────────────────────────────────────────────
window.deleteTask = async (id) => {
  if (confirm('Delete this task?')) {
    setSyncStatus('syncing');
    await deleteDoc(doc(db,'tasks',id));
  }
};

// ── OPEN SHEET (NEW) ─────────────────────────────────────────────
window.openSheet = () => {
  document.getElementById('sheet-title').textContent = 'New Task';
  document.getElementById('save-btn').textContent = 'Save Task';
  document.getElementById('f-title').value = '';
  document.getElementById('f-cat').value = 'YPO Operations';
  document.getElementById('f-pri').value = 'Medium';
  document.getElementById('f-edit-id').value = '';
  document.getElementById('other-input').classList.remove('show');
  document.getElementById('f-other-cat').value = '';
  const d = new Date(); d.setDate(d.getDate()+1);
  document.getElementById('f-due').value = d.toISOString().split('T')[0];
  document.getElementById('f-time').value = '09:00';
  document.getElementById('f-alarm').value = '60';
  document.getElementById('sheet-overlay').classList.add('open');
  setTimeout(() => document.getElementById('f-title').focus(), 300);
};

// ── OPEN SHEET (EDIT) ────────────────────────────────────────────
window.editTask = (id) => {
  const t = tasks.find(x => x.id === id);
  if (!t) return;
  document.getElementById('sheet-title').textContent = 'Edit Task';
  document.getElementById('save-btn').textContent = 'Update Task';
  document.getElementById('f-title').value = t.title || '';
  document.getElementById('f-pri').value = t.pri || 'Medium';
  document.getElementById('f-due').value = t.due || '';
  document.getElementById('f-time').value = t.time || '09:00';
  document.getElementById('f-alarm').value = t.alarm != null ? String(t.alarm) : '60';
  document.getElementById('f-edit-id').value = id;
  const cats = ['YPO Operations','SUA','Consulting','Meetings','Family'];
  if (cats.includes(t.cat)) {
    document.getElementById('f-cat').value = t.cat;
    document.getElementById('other-input').classList.remove('show');
  } else {
    document.getElementById('f-cat').value = 'Other';
    document.getElementById('other-input').classList.add('show');
    document.getElementById('f-other-cat').value = t.cat || '';
  }
  document.getElementById('sheet-overlay').classList.add('open');
};

window.handleCatChange = () => {
  const val = document.getElementById('f-cat').value;
  const oi = document.getElementById('other-input');
  if (val === 'Other') { oi.classList.add('show'); document.getElementById('f-other-cat').focus(); }
  else oi.classList.remove('show');
};

window.closeSheet = (e) => {
  if (e.target === document.getElementById('sheet-overlay'))
    document.getElementById('sheet-overlay').classList.remove('open');
};

// ── SAVE / UPDATE ────────────────────────────────────────────────
window.saveTask = async () => {
  const title = document.getElementById('f-title').value.trim();
  if (!title) { document.getElementById('f-title').focus(); return; }
  let cat = document.getElementById('f-cat').value;
  if (cat === 'Other') cat = document.getElementById('f-other-cat').value.trim() || 'Other';
  const payload = {
    title, cat,
    pri: document.getElementById('f-pri').value,
    due: document.getElementById('f-due').value,
    time: document.getElementById('f-time').value,
    alarm: parseInt(document.getElementById('f-alarm').value),
    done: false
  };
  const editId = document.getElementById('f-edit-id').value;
  setSyncStatus('syncing');
  if (editId) {
    const existing = tasks.find(x => x.id === editId);
    payload.done = existing ? existing.done : false;
    await updateDoc(doc(db,'tasks',editId), payload);
  } else {
    payload.createdAt = serverTimestamp();
    await addDoc(tasksCol, payload);
  }
  document.getElementById('sheet-overlay').classList.remove('open');
};

// ── RENDER ───────────────────────────────────────────────────────
function render() {
  document.getElementById('today-label').textContent =
    new Date().toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long',year:'numeric'});

  const now = new Date();
  let visible = currentFilter === 'done' ? tasks.filter(t => t.done)
    : currentFilter === 'delayed' ? tasks.filter(t => {
        if (t.done) return false;
        if (!t.due) return false;
        const dd = t.time ? new Date(t.due+'T'+t.time) : (() => { const d=new Date(t.due); d.setHours(23,59,0,0); return d; })();
        return dd < now;
      })
    : currentFilter === 'all' ? tasks.filter(t => !t.done)
    : tasks.filter(t => t.pri === currentFilter && !t.done);

  // Sort by nearest deadline first, then by priority for same deadline
  const sorted = [...visible].sort((a, b) => {
    if (a.done !== b.done) return a.done ? 1 : -1;
    const da = getDeadlineMs(a);
    const db2 = getDeadlineMs(b);
    if (da !== db2) return da - db2;
    return ({High:0,Medium:1,Low:2}[a.pri]||1) - ({High:0,Medium:1,Low:2}[b.pri]||1);
  });

  const list = document.getElementById('task-list');
  const emptyMsg = currentFilter === 'delayed' 
    ? '✅ No delayed tasks — you are on track!'
    : 'No tasks here';
  list.innerHTML = sorted.length ? sorted.map((t,i) => {
    const ds = dueStatus(t.due, t.time, t.done);
    const rankLabel = !t.done ? `<span style="font-size:10px;color:var(--text-muted);margin-right:2px">#${i+1}</span>` : '';
    return `<div class="task-card pri-${t.pri} ${t.done?'done':''}" data-id="${t.id}">
      <button class="check-btn" onclick="toggleDone('${t.id}')">${t.done?'✓':''}</button>
      <div class="task-body">
        <div class="task-title">${rankLabel}${t.title}</div>
        <div class="task-meta">
          <span class="badge badge-${t.pri}">${t.pri}</span>
          <span class="badge badge-cat">${t.cat}</span>
          ${ds?`<span class="due-chip ${ds.alert?'alert':''}">🕐 ${ds.label}</span>`:t.time?`<span class="due-chip">🕐 ${fmt12(t.time)}</span>`:''}
        </div>
      </div>
      <div class="card-actions">
        <button class="edit-btn" onclick="editTask('${t.id}')" title="Edit">✏</button>
        <button class="del-btn" onclick="deleteTask('${t.id}')" title="Delete">✕</button>
      </div>
    </div>`;
  }).join('') : '<div class="empty">'+emptyMsg+'</div>';

  const alerts = tasks.filter(t => { if(t.done) return false; const ds=dueStatus(t.due,t.time,false); return ds&&ds.alert; });
  const ab = document.getElementById('alert-bar');
  if (alerts.length) {
    ab.classList.add('show');
    document.getElementById('alert-text').textContent = alerts.length+' task'+(alerts.length>1?'s':'')+' need your attention today';
  } else ab.classList.remove('show');

  const nowR = new Date();
  const delayedCount = tasks.filter(t => {
    if (t.done || !t.due) return false;
    const dd = t.time ? new Date(t.due+'T'+t.time) : (() => { const d=new Date(t.due); d.setHours(23,59,0,0); return d; })();
    return dd < nowR;
  }).length;
  document.getElementById('s-total').textContent = tasks.length;
  document.getElementById('s-pending').textContent = tasks.filter(t=>!t.done).length;
  document.getElementById('s-delayed').textContent = delayedCount;
  document.getElementById('s-done').textContent = tasks.filter(t=>t.done).length;
}

if ('Notification' in window && Notification.permission === 'default') Notification.requestPermission();
setInterval(render, 30000);
document.getElementById('today-label').textContent =
  new Date().toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
setSyncStatus('syncing');
</script>
</body>
